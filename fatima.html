<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para Fatima ❤️</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ============================
       RESET & BASE
       ============================ */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(ellipse at center, #1a0a1e 0%, #0d0510 50%, #000000 100%);
      color: #fff;
    }

    /* ============================
       CANVAS DE ESTRELLAS (fondo)
       ============================ */
    #stars-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ============================
       CONTENEDOR PRINCIPAL
       ============================ */
    .main-container {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    /* ============================
       CORAZÓN (canvas de letras)
       ============================ */
    .heart-wrapper {
      position: relative;
      width: 420px;
      height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    #heart-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* ============================
       TEXTO CENTRAL (dentro del corazón)
       ============================ */
    .center-text {
      position: absolute;
      z-index: 2;
      font-family: 'Dancing Script', cursive;
      font-size: 1.65rem;
      text-align: center;
      line-height: 1.3;
      color: #ff4d8a;
      text-shadow:
        0 0 10px rgba(255, 77, 138, 0.8),
        0 0 30px rgba(255, 77, 138, 0.5),
        0 0 60px rgba(255, 77, 138, 0.3);
      animation: heartbeat 1.3s ease-in-out infinite;
      pointer-events: none;
      user-select: none;
    }

    /* Animación de latido */
    @keyframes heartbeat {
      0%   { transform: scale(1); }
      14%  { transform: scale(1.12); }
      28%  { transform: scale(1); }
      42%  { transform: scale(1.08); }
      56%  { transform: scale(1); }
      100% { transform: scale(1); }
    }

    /* ============================
       CAJA GLASSMORPHISM
       ============================ */
    .glass-box {
      max-width: 520px;
      width: 90%;
      padding: 24px 30px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.4),
        inset 0 0 30px rgba(255, 77, 138, 0.04);
      text-align: center;
      flex-shrink: 0;
    }

    .typewriter-text {
      font-family: 'Poppins', sans-serif;
      font-weight: 300;
      font-size: 1rem;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.88);
      min-height: 3.4em;
    }

    /* Cursor parpadeante */
    .typewriter-cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background: #ff4d8a;
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 0.7s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>
</head>

<body>
  <!-- Canvas de estrellas de fondo -->
  <canvas id="stars-canvas"></canvas>

  <!-- Contenedor principal -->
  <div class="main-container">
    <!-- Corazón con letras orbitando -->
    <div class="heart-wrapper">
      <canvas id="heart-canvas"></canvas>
      <div class="center-text">Te quiero<br />mucho calvita</div>
    </div>

    <!-- Caja glassmorphism con typewriter -->
    <div class="glass-box">
      <p class="typewriter-text" id="typewriter">
        <span class="typewriter-cursor"></span>
      </p>
    </div>
  </div>

  <script>
    /* ============================================================
       1. CANVAS DE ESTRELLAS (fondo animado)
       ============================================================ */
    (function initStars() {
      const canvas = document.getElementById('stars-canvas');
      const ctx = canvas.getContext('2d');
      let stars = [];
      const STAR_COUNT = 180;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      // Crear estrellas
      for (let i = 0; i < STAR_COUNT; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 1.4 + 0.3,
          dx: (Math.random() - 0.5) * 0.15,
          dy: (Math.random() - 0.5) * 0.15,
          alpha: Math.random() * 0.6 + 0.2,
          twinkleSpeed: Math.random() * 0.008 + 0.003,
          twinklePhase: Math.random() * Math.PI * 2,
        });
      }

      function drawStars(time) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        stars.forEach((s) => {
          // Movimiento suave
          s.x += s.dx;
          s.y += s.dy;

          // Wrap edges
          if (s.x < 0) s.x = canvas.width;
          if (s.x > canvas.width) s.x = 0;
          if (s.y < 0) s.y = canvas.height;
          if (s.y > canvas.height) s.y = 0;

          // Parpadeo (twinkle)
          const alpha = s.alpha + Math.sin(time * s.twinkleSpeed + s.twinklePhase) * 0.25;

          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.05, alpha)})`;
          ctx.fill();
        });

        requestAnimationFrame(drawStars);
      }
      requestAnimationFrame(drawStars);
    })();

    /* ============================================================
       2. CORAZÓN GIRATORIO CON LETRAS ORBITANDO
       ============================================================ */
    (function initHeart() {
      const canvas = document.getElementById('heart-canvas');
      const ctx = canvas.getContext('2d');

      // Alta resolución (retina)
      function resize() {
        const wrapper = canvas.parentElement;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = wrapper.clientWidth * dpr;
        canvas.height = wrapper.clientHeight * dpr;
        canvas.style.width = wrapper.clientWidth + 'px';
        canvas.style.height = wrapper.clientHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize);
      resize();

      // Texto que se repite para formar el corazón
      const WORD = 'FATIMA ♡ ';
      const TOTAL_LETTERS = 90; // cantidad de letras a repartir
      const letters = [];

      // Generar las letras con offsets equidistantes en el ángulo t
      for (let i = 0; i < TOTAL_LETTERS; i++) {
        letters.push({
          char: WORD[i % WORD.length],
          offset: (i / TOTAL_LETTERS) * Math.PI * 2, // posición angular inicial
        });
      }

      // Ecuación paramétrica del corazón
      // x = 16 sin³(t)
      // y = 13 cos(t) – 5 cos(2t) – 2 cos(3t) – cos(4t)
      function heartX(t) {
        return 16 * Math.pow(Math.sin(t), 3);
      }
      function heartY(t) {
        return -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      }

      const SCALE = 11; // escala del corazón
      const CX = 210;   // centro X en el canvas lógico (420/2)
      const CY = 190;   // centro Y (un poco arriba para dejar espacio)

      // Velocidad de órbita
      const SPEED = 0.0004;

      function draw(time) {
        const w = canvas.parentElement.clientWidth;
        const h = canvas.parentElement.clientHeight;
        ctx.clearRect(0, 0, w, h);

        // Ángulo global que avanza con el tiempo
        const globalAngle = time * SPEED;

        ctx.font = "bold 13px 'Poppins', sans-serif";
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        letters.forEach((l) => {
          const t = globalAngle + l.offset;
          const x = CX + heartX(t) * SCALE;
          const y = CY + heartY(t) * SCALE;

          // Glow neón rosa/rojo
          ctx.shadowColor = 'rgba(255, 50, 100, 0.9)';
          ctx.shadowBlur = 18;
          ctx.fillStyle = '#ff3366';
          ctx.fillText(l.char, x, y);

          // Segunda capa con más glow
          ctx.shadowColor = 'rgba(255, 100, 150, 0.5)';
          ctx.shadowBlur = 30;
          ctx.fillText(l.char, x, y);
        });

        // Resetear sombras
        ctx.shadowBlur = 0;

        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
    })();

    /* ============================================================
       3. EFECTO MÁQUINA DE ESCRIBIR (TYPEWRITER)
       ============================================================ */
    (function initTypewriter() {
      const message =
        'Puedes con todo en este mundo. Eres la niña más fuerte del mundo y estoy súper orgulloso de ti. 💖';
      const container = document.getElementById('typewriter');
      let index = 0;

      // Pequeña pausa inicial antes de empezar
      setTimeout(function type() {
        if (index < message.length) {
          // Insertar la letra antes del cursor
          const cursor = container.querySelector('.typewriter-cursor');
          const span = document.createElement('span');
          span.textContent = message[index];
          container.insertBefore(span, cursor);

          index++;

          // Velocidad variable: más lenta en puntos y comas
          const char = message[index - 1];
          const delay = char === '.' || char === ',' ? 180 : char === ' ' ? 60 : 50;
          setTimeout(type, delay);
        }
      }, 1200);
    })();
  </script>
</body>
</html>
